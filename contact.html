<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Contact UZ Industry | Custom Sportswear Manufacturer</title>

<style>
*{
  margin:0;
  padding:0;
  box-sizing:border-box;
}

body{
  font-family:Arial,Helvetica,sans-serif;
  background:#08090b;
  color:#fff;
}

a{
  text-decoration:none;
  color:inherit;
}

/* HEADER */
header{
  background:#0d0e11;
  border-bottom:1px solid #222;
  position:sticky;
  top:0;
  z-index:1000;
}

.headerWrap{
  max-width:1250px;
  margin:auto;
  padding:12px 25px;
  display:flex;
  align-items:center;
  justify-content:space-between;
}

.logo img{
  height:65px;
  width:auto;
  display:block;
}

nav{
  display:flex;
  align-items:center;
  gap:24px;
}

nav a{
  font-size:13px;
  font-weight:800;
  text-transform:uppercase;
}

nav a:hover{
  color:#ef1b24;
}

.active{
  color:#ef1b24;
}

.quoteBtn{
  background:#ef1b24;
  color:#fff !important;
  padding:13px 20px;
  border-radius:5px;
}

/* HERO */
.contactHero{
  text-align:center;
  padding:85px 20px 55px;
  background:
  radial-gradient(circle at center,#1c1d22 0%,#08090b 68%);
}

.eyebrow{
  color:#ef1b24;
  font-size:13px;
  letter-spacing:2px;
  font-weight:900;
  margin-bottom:14px;
}

.contactHero h1{
  font-size:48px;
  text-transform:uppercase;
  margin-bottom:16px;
}

.contactHero p{
  max-width:720px;
  margin:auto;
  color:#aaa;
  line-height:1.7;
}

/* MAIN */
.contactSection{
  max-width:1150px;
  margin:auto;
  padding:60px 25px 90px;
}

.contactIntro{
  text-align:center;
  margin-bottom:40px;
}

.contactIntro h2{
  font-size:34px;
  text-transform:uppercase;
  margin-bottom:12px;
}

.contactIntro p{
  color:#aaa;
  max-width:650px;
  margin:auto;
  line-height:1.7;
}

/* CONTACT CARDS */
.contactGrid{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:22px;
}

.contactCard{
  background:#101115;
  border:1px solid #25262b;
  border-radius:12px;
  padding:28px;
  transition:.25s;
}

.contactCard:hover{
  transform:translateY(-4px);
  border-color:#ef1b24;
}

.contactIcon{
  font-size:34px;
  margin-bottom:18px;
}

.contactCard h3{
  font-size:21px;
  text-transform:uppercase;
  margin-bottom:10px;
}

.contactCard p{
  color:#999;
  font-size:14px;
  line-height:1.6;
  margin-bottom:20px;
}

.contactButton{
  display:inline-block;
  background:#ef1b24;
  color:#fff;
  padding:13px 20px;
  border-radius:5px;
  font-size:13px;
  font-weight:900;
  text-transform:uppercase;
}

/* BUSINESS INFO */
.businessInfo{
  margin-top:45px;
  background:#101115;
  border:1px solid #25262b;
  border-radius:14px;
  padding:35px;
  text-align:center;
}

.businessInfo h2{
  text-transform:uppercase;
  font-size:28px;
  margin-bottom:22px;
}

.infoRow{
  margin:10px 0;
  color:#bbb;
  line-height:1.6;
}

.infoRow strong{
  color:#fff;
}

/* CTA */
.finalCTA{
  text-align:center;
  margin-top:50px;
  padding:55px 25px;
  background:#111216;
  border:1px solid #292a30;
  border-radius:15px;
}

.finalCTA h2{
  font-size:34px;
  text-transform:uppercase;
  margin-bottom:13px;
}

.finalCTA p{
  color:#aaa;
  line-height:1.7;
  max-width:650px;
  margin:0 auto 25px;
}
